<rect x="40" y="400" width="1520" height="700" rx="16" fill="#F7F5FF" stroke="#8C4FFF" stroke-width="1.5"/>
<text x="64" y="430" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4B2A8C">VPC — bluegreen-demo-vpc (10.20.0.0/16)</text>
<text x="64" y="448" font-family="Arial, sans-serif" font-size="11" fill="#6B4AB0">2 public subnets, 1 per Availability Zone</text>

