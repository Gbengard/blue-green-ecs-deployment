<rect x="280" y="170" width="620" height="160" rx="12" fill="#EFF3FF" stroke="#527FFF" stroke-width="1"/>
<text x="300" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1A3BB3">CodePipeline — bluegreen-demo-pipeline</text>

<g>
  <rect x="300" y="215" width="170" height="95" rx="8" fill="#E6ECFF" stroke="#527FFF" stroke-width="1"/>
  <text x="385" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1A3BB3">Source</text>
  <text x="385" y="263" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">pulls on push via</text>
  <text x="385" y="278" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">CodeStar connection</text>
</g>

<g>
  <rect x="490" y="215" width="170" height="95" rx="8" fill="#E6ECFF" stroke="#527FFF" stroke-width="1"/>
  <text x="575" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1A3BB3">Build</text>
  <text x="575" y="263" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">CodeBuild: builds</text>
  <text x="575" y="278" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">image, pushes to ECR</text>
</g>

<g>
