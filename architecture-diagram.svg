<svg width="1600" height="1180" viewBox="0 0 1600 1180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture diagram: zero-downtime blue-green deployment on ECS Fargate</title>
<desc>GitHub pushes code through CodeStar Connection into CodePipeline (Source, Build, Deploy stages). Build pushes images to ECR and artifacts to S3. Deploy updates the ECS service inside a VPC, where an Application Load Balancer routes production traffic to a Blue target group and test-header traffic to a Green target group, each backed by ECS Fargate tasks in separate subnets. A manual approval gate sits before production cutover. Task logs flow to CloudWatch Logs.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1600" height="1180" fill="#ffffff"/>

<!-- ============ TITLE ============ -->
<text x="40" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#161616">Zero-downtime blue-green deployment on ECS Fargate</text>

<!-- ============ EXTERNAL ACTORS ============ -->
<g>
  <rect x="40" y="70" width="200" height="72" rx="8" fill="#F2F3F3" stroke="#545B64" stroke-width="1"/>
  <text x="140" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#232F3E">GitHub repo</text>
  <text x="140" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#545B64">pipeline-config/ branch: main</text>
</g>

<g>
  <rect x="1360" y="70" width="200" height="72" rx="8" fill="#F2F3F3" stroke="#545B64" stroke-width="1"/>
  <text x="1460" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#232F3E">End users</text>
  <text x="1460" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#545B64">normal browser traffic</text>
</g>

<g>
  <rect x="1360" y="160" width="200" height="72" rx="8" fill="#F2F3F3" stroke="#545B64" stroke-width="1"/>
  <text x="1460" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#232F3E">You (testing)</text>
  <text x="1460" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#545B64">curl -H X-Bg-Test: true</text>
</g>

