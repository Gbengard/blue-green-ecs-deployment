  <text x="765" y="263" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">Amazon ECS action:</text>
  <text x="765" y="278" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E4FB8">UpdateService</text>
</g>

<!-- ECR + S3 (storage, green) -->
<g>
  <rect x="960" y="190" width="190" height="72" rx="8" fill="#EAF3DE" stroke="#7AA116" stroke-width="1"/>
  <text x="1055" y="220" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3B5411">ECR repository</text>
  <text x="1055" y="238" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4B6B16">bluegreen-demo-app</text>
</g>

<g>
  <rect x="960" y="280" width="190" height="72" rx="8" fill="#EAF3DE" stroke="#7AA116" stroke-width="1"/>
  <text x="1055" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3B5411">S3 artifact bucket</text>
  <text x="1055" y="328" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4B6B16">pipeline artifacts</text>
</g>

