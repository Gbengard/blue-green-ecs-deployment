version: 0.2

# This buildspec builds the Docker image, pushes it to ECR, then writes
# imagedefinitions.json — the one file the standard "Amazon ECS" deploy
# action in CodePipeline needs. It maps the container name to the new
# image, registers a new task definition revision, and calls UpdateService.
# ECS itself then handles the blue/green shift, because the service's
# DeploymentConfiguration.Strategy is set to BLUE_GREEN.

phases:
  pre_build:
    commands:
      - echo Fetching AWS Environment Metadata...
      # Dynamically resolves the active account ID and region if they aren't injected externally
      - if [ -z "$AWS_ACCOUNT_ID" ]; then AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text); fi
      - if [ -z "$AWS_REGION" ]; then AWS_REGION=$(aws configure get region); fi
      
      - echo Logging in to ECR
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME

  build:
    commands:
      - echo Building Docker image
      - docker build -t $REPO_URI:$IMAGE_TAG -t $REPO_URI:latest .

  post_build:
    commands:
      - echo Pushing image to ECR
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:latest
      - echo Writing imagedefinitions.json for the CodePipeline ECS deploy action
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPO_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
